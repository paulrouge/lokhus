name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - name: Install exactly what the lockfile pins, without install scripts
        run: npm ci --ignore-scripts
      - name: Supply chain rules
        run: node scripts/check-supply-chain.ts
      - name: Registry signatures and provenance
        run: npm audit signatures
      - name: Known critical vulnerabilities
        run: npm audit --omit=dev --audit-level=critical
      - name: Docs match the code
        run: node scripts/check-docs.ts
      - run: npm run typecheck
      - run: npx vitest run
