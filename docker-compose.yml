services:
  lokhus:
    build:
      context: .
      args:
        VITE_WC_PROJECT_ID: ${VITE_WC_PROJECT_ID:-}
    image: lokhus:latest
    restart: unless-stopped
    expose:
      - '8787'
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      LOKHUS_MODE: ${LOKHUS_MODE:-hosted}
      LOKHUS_HOSTS: ${LOKHUS_HOSTS:-}
      LOKHUS_TRUST_PROXY: ${LOKHUS_TRUST_PROXY:-1}
      LOKHUS_PROXY_HOPS: ${LOKHUS_PROXY_HOPS:-1}
    volumes:
      - lokhus-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  lokhus-data:
